<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Budgetly — Browser-based expense tracker by 0xR3TRO"
        />
        <meta name="author" content="0xR3TRO" />
        <meta name="theme-color" content="#6c5ce7" />
        <title>Budgetly — Expense Tracker</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>"
        />
        <link rel="stylesheet" href="styles/styles.css" />
    </head>
    <body>
        <!-- Toast Container -->
        <div id="toast-container"></div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal" id="modal">
                <div class="modal-header">
                    <h3 id="modal-title"></h3>
                    <button class="modal-close" id="modal-close">
                        &times;
                    </button>
                </div>
                <div class="modal-body" id="modal-body"></div>
                <div class="modal-footer" id="modal-footer"></div>
            </div>
        </div>

        <!-- App Shell -->
        <div class="app">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-icon">💰</span>
                        <span class="logo-text">Budgetly</span>
                    </div>
                    <button class="sidebar-toggle" id="sidebar-toggle">
                        ☰
                    </button>
                </div>
                <nav class="sidebar-nav" id="sidebar-nav">
                    <a
                        href="#dashboard"
                        class="nav-item active"
                        data-view="dashboard"
                    >
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Dashboard</span>
                    </a>
                    <a href="#expenses" class="nav-item" data-view="expenses">
                        <span class="nav-icon">💸</span>
                        <span class="nav-label">Expenses</span>
                    </a>
                    <a
                        href="#categories"
                        class="nav-item"
                        data-view="categories"
                    >
                        <span class="nav-icon">🏷️</span>
                        <span class="nav-label">Categories</span>
                    </a>
                    <a href="#settings" class="nav-item" data-view="settings">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Settings</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <small
                        >© 2026
                        <a href="https://github.com/0xR3TRO" target="_blank"
                            >0xR3TRO</a
                        ></small
                    >
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content" id="main-content">
                <header class="topbar">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">
                        ☰
                    </button>
                    <h2 class="page-title" id="page-title">Dashboard</h2>
                    <div class="topbar-actions">
                        <div class="search-box">
                            <input
                                type="text"
                                id="global-search"
                                placeholder="Search expenses..."
                                autocomplete="off"
                            />
                            <span class="search-icon">🔍</span>
                        </div>
                        <button
                            class="theme-toggle"
                            id="theme-toggle"
                            title="Toggle theme"
                        >
                            🌙
                        </button>
                    </div>
                </header>
                <div class="content" id="content">
                    <!-- Dynamic content rendered here -->
                </div>
            </main>
        </div>

        <!-- Scripts (modules) -->
        <script src="scripts/utils.js"></script>
        <script src="scripts/storage.js"></script>
        <script src="scripts/charts.js"></script>
        <script src="scripts/components/modal.js"></script>
        <script src="scripts/components/toast.js"></script>
        <script src="scripts/components/dropdown.js"></script>
        <script src="scripts/components/tabs.js"></script>
        <script src="scripts/views/dashboard.js"></script>
        <script src="scripts/views/expenses.js"></script>
        <script src="scripts/views/categories.js"></script>
        <script src="scripts/views/settings.js"></script>
        <script src="scripts/router.js"></script>
        <script src="scripts/app.js"></script>
    </body>
</html>
